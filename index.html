<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patho Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Patho Deutsch</title>
<style>
/* 모양: H&E 염색 색 — 헤마톡실린 보라(주 색) + 에오신 분홍(보조 색). 크림빛 라벤더 바탕, 흰 카드.
   관사 색: der 파랑, die 빨강, das 초록 (독일어 학습에서 흔히 쓰는 색) */
:root {
  --bg: #f6f1fb; --card: #ffffff; --ink: #2b2238; --muted: #7a6e8a; --line: #ebe3f4; --field: #f3edfa;
  --accent: #6a4fbb; --accent-ink: #ffffff; --soft: #ece4f9; --eosin: #e2669a; --eosin-soft: #fde7f0;
  --good: #2f9e6a; --good-soft: #e3f5ec; --bad: #d4506e; --bad-soft: #fde8ec;
  --der: #2f6fd0; --die: #d43f6c; --das: #23905d;
  --bm-body: #fbf8fe; --bm-line: #cbbfdb; --o: #e3d9f0; --o2: #c4b5da; --hl: #e2669a;
  --r: 22px; --r-sm: 16px;
  --shadow: 0 1px 2px rgba(43, 34, 56, .05), 0 6px 18px rgba(106, 79, 187, .07);
  --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16121d; --card: #221c2b; --ink: #f1ecf8; --muted: #b0a5c0; --line: #342b40; --field: #2b2336;
    --accent: #a98ef0; --accent-ink: #1c1030; --soft: #33284a; --eosin: #ff8db8; --eosin-soft: #45233a;
    --good: #5fd39b; --good-soft: #1e3a2e; --bad: #ff8aa2; --bad-soft: #452630;
    --der: #7fb0ff; --die: #ff86a8; --das: #6fd6a3;
    --bm-body: #2b2336; --bm-line: #4a3f5a; --o: #3d3350; --o2: #5a4d70; --hl: #ff8db8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 540px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { margin-bottom: 16px; }
.date { margin: 0 0 2px; font-size: 14px; color: var(--muted); }
h1 { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14px; }
.btn { flex: none; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 20px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: var(--field); color: var(--ink); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.wide { width: 100%; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.row { display: flex; gap: 8px; }
.row > .btn { flex: 1; }

/* 아래 탭 막대 */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
nav.tabbar button { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; color: var(--muted); }
nav.tabbar svg { width: 26px; height: 26px; }
nav.tabbar button.on { color: var(--accent); font-weight: 600; }

/* ── 단어장 첫 화면 ── */
.hero { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; flex: none; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring .in b { font-size: 28px; font-weight: 800; }
.ring .in span { display: block; font-size: 12px; color: var(--muted); }
.hero-text { flex: 1; min-width: 0; }
.hero-text h2 { margin: 0 0 4px; font-size: 20px; }
.hero-text p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tile { border-radius: var(--r-sm); background: var(--card); box-shadow: var(--shadow); padding: 12px 10px; text-align: center; }
.tile b { display: block; font-weight: 800; font-size: 22px; line-height: 1.2; }
.tile span { font-size: 12px; color: var(--muted); }
.tile b small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.list-btns { display: grid; gap: 8px; }
.menu-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: var(--r-sm); background: var(--field); font-weight: 700; }
.menu-btn .ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--card); font-size: 18px; }
.menu-btn small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.menu-btn .go { margin-left: auto; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 99px; background: var(--field); color: var(--ink); white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
.set-line + .set-line { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.set-line > span { font-size: 15px; }

/* 관사 색 */
.art { font-weight: 700; }
.art.der { color: var(--der); } .art.die { color: var(--die); } .art.das { color: var(--das); }
.kind { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--field); border-radius: 99px; padding: 2px 8px; vertical-align: 3px; }

/* ── 공부 화면 (카드) ── */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
.overlay-inner { width: 100%; max-width: 540px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 6px 6px; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.x-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--muted); }
.x-btn svg { width: 20px; height: 20px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.count { flex: none; font-size: 14px; color: var(--muted); font-weight: 600; }
.plural { font-size: 15px; color: var(--muted); }
.hint { text-align: center; font-size: 13px; color: var(--muted); }
.say { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--soft); color: var(--accent); margin-top: 6px; }
.say svg { width: 22px; height: 22px; }
.say.sm { width: 34px; height: 34px; margin: 0; flex: none; }
.say.sm svg { width: 18px; height: 18px; }
.info { margin-top: 14px; border-radius: var(--r-sm); background: var(--field); padding: 12px 14px; font-size: 15.5px; }
.info h4 { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.info p { margin: 0; }
.info.ex { display: flex; gap: 10px; align-items: flex-start; background: var(--eosin-soft); }
.info.ex p { flex: 1; font-style: italic; }
.info.ex mark { background: none; color: var(--eosin); font-weight: 700; font-style: normal; }
.done-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.done-screen .emo { font-size: 64px; line-height: 1; }
.done-screen h2 { margin: 6px 0 0; font-size: 26px; }
.done-screen p { margin: 0 0 12px; color: var(--muted); }
.done-screen .btns { display: grid; gap: 8px; width: 100%; max-width: 320px; }

/* ── 단어 목록 / 추가 (아래에서 올라오는 시트) ── */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(20, 12, 30, .35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column; background: var(--bg); border-radius: 26px 26px 0 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet-body { overflow: auto; flex: 1; min-height: 0; margin: 0 -16px; padding: 0 16px; }
.search { width: 100%; min-height: 46px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); padding: 0 14px; margin-bottom: 10px; }
/* 분야 탭: 한눈에 다 보이게 여러 줄로, 흰 바탕 + 테두리로 또렷하게 */
.cat-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 14px; }
.cat-tabs button { min-height: 38px; padding: 0 13px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow);
  font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.cat-tabs button small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.cat-tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cat-tabs button.on small { color: var(--accent-ink); opacity: .8; }
.wl { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
.wl li { border-top: 1px solid var(--line); }
.wl li:first-child { border-top: 0; }
.wl .wl-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; }
.wl .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.wl .dot.l { background: var(--eosin); } .wl .dot.k { background: var(--good); }
.wl .w { flex: 1; min-width: 0; font-weight: 600; }
.wl .k { color: var(--muted); font-size: 14px; text-align: right; max-width: 45%; }
.wl .more { padding: 0 14px 12px 33px; font-size: 14.5px; }
.wl .more p { margin: 4px 0; }
.wl .more .ex { font-style: italic; color: var(--muted); }
/* ── 연습: 관사 퀴즈 · 빈칸 채우기 ── */
.cz { margin-bottom: 14px; }
.cz-sent { overflow-wrap: anywhere; word-break: break-word; align-self: stretch; font-size: 19px; line-height: 1.65; margin: 0 0 12px; }
.gap { display: inline-block; min-width: 96px; border-bottom: 3px solid var(--accent); margin: 0 3px; color: var(--accent); font-weight: 700; }
.cz-sent mark { background: none; font-weight: 800; } .cz-sent mark.ok { color: var(--good); } .cz-sent mark.no { color: var(--bad); }
.cz-foot { display: flex; align-items: center; gap: 10px; }
.cz-ko { flex: 1; margin: 0; color: var(--muted); font-size: 15px; }
.done-screen.pd { justify-content: flex-start; padding: 24px 0 8px; }
.done-screen .wl { width: 100%; max-width: 380px; text-align: left; margin-bottom: 12px; }
/* 본문 단어 탭 */
.tw { cursor: pointer; border-radius: 4px; }
.tw.k { text-decoration: underline dotted color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.tw.on { background: var(--soft); box-shadow: 0 0 0 2px var(--soft); }
.pop-ko { font-size: 22px; font-weight: 800; margin: 2px 0 6px; }
.tap-tip { font-size: 13.5px; color: var(--muted); margin: -4px 0 12px; }
.wl .more .tools { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
.inp { width: 100%; min-width: 0; min-height: 46px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); padding: 10px 14px; }
.inp:focus, .inp:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }
textarea.inp { min-height: 70px; resize: vertical; }
.empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: 15px; }

/* ── 병리 공부 ── */
.progress-line { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
.progress-line .bar { height: 6px; }
.lesson-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
.lesson-card .ic { flex: none; width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: var(--soft); }
.lesson-card .t { flex: 1; min-width: 0; }
.lesson-card .t b { display: block; font-size: 16.5px; line-height: 1.3; }
.lesson-card .t span { font-size: 13.5px; color: var(--muted); }
.group-h { font-size: 15px; font-weight: 800; color: var(--muted); margin: 18px 4px 8px; }
.group-h:first-of-type { margin-top: 4px; }
.badge { flex: none; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 3px 9px; background: var(--field); color: var(--muted); }
.badge.full { background: var(--good-soft); color: var(--good); }
.badge.new { background: var(--eosin); color: #fff; letter-spacing: .03em; }
.new-banner { background: var(--eosin-soft); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
.new-banner .badge { vertical-align: 1px; }
.report-link { display: block; margin: 14px auto 0; padding: 8px 12px; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.badge.part { background: var(--eosin-soft); color: var(--eosin); }
.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; font-size: 15px; margin-bottom: 10px; min-height: 36px; }
.back-link svg { width: 18px; height: 18px; }
.lesson-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.lesson-head .ic { flex: none; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: var(--card); box-shadow: var(--shadow); }
.lesson-head h2 { margin: 0; font-size: 23px; line-height: 1.2; font-weight: 800; }
.lesson-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.sec h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; color: var(--accent); }
.txt p { margin: 0 0 10px; }
.txt ul { margin: 0 0 10px; padding-left: 0; list-style: none; }
.txt li { position: relative; padding-left: 18px; margin: 5px 0; }
.txt li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--eosin); }
.txt b { color: var(--ink); font-weight: 750; background: linear-gradient(transparent 62%, var(--eosin-soft) 62%); }
.txt > :last-child { margin-bottom: 0; }
.ko-box { margin-top: 12px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--field); font-size: 15.5px; color: var(--ink); }
.ko-box b { background: none; }
.sec-tools { display: flex; gap: 8px; margin-top: 12px; }
.sec-tools .chip { display: inline-flex; align-items: center; gap: 5px; }
.sec-tools .chip svg { width: 16px; height: 16px; }
.terms { list-style: none; margin: 0; padding: 0; }
.terms li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.terms li:first-child { border-top: 0; }
.terms .tde { flex: 1; font-weight: 700; }
.terms .tko { color: var(--muted); font-size: 14px; text-align: right; }
.v-pick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); }
.v-pick.on { border: 7px solid var(--accent); }
.fx.has-bm { display: flex; gap: 12px; align-items: flex-start; }
.fx-body { flex: 1; min-width: 0; }
.fx-pic { flex: none; width: 64px; height: 64px; border-radius: 14px; background: var(--field); padding: 3px; }
.bm { width: 100%; height: 100%; display: block; }
.bm-big { height: min(52vh, 380px); background: var(--field); border-radius: var(--r); padding: 10px; }
.fx { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; }
.fx { position: relative; }
.fx-body { padding-right: 38px; }
.fx-main { font-size: 17px; line-height: 1.35; }
.fx-main .fx-al { display: block; }
.fx-al { font-weight: 700; }
.fx-eq { color: var(--muted); }
.fx-fa { font-weight: 800; color: var(--accent); overflow-wrap: anywhere; }
.fx-main .say { position: absolute; top: 10px; right: 10px; }
.fx-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.fx-sub b { color: var(--ink); font-weight: 650; }
.fx-ex { font-size: 13.5px; color: var(--muted); font-style: italic; margin-top: 2px; }
.fx-hid { display: inline-block; min-width: 70px; text-align: center; border-radius: 8px; background: var(--soft); color: var(--accent); font-weight: 800; }
.fx-real { display: none; }
.fx.show .fx-hid { display: none; } .fx.show .fx-real { display: inline; }
.fx.quiz { cursor: pointer; }
.fx.quiz:not(.show) .fx-sub, .fx.quiz:not(.show) .fx-ex { visibility: hidden; height: 0; margin: 0; }
/* 단계식 단어 공부 */
.lc > * { max-width: 100%; }
.lc { position: relative; background: var(--card); border-radius: 26px; box-shadow: 0 2px 4px rgba(43, 34, 56, .06), 0 14px 34px rgba(106, 79, 187, .12);
  padding: 20px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.lc .cat { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--soft); border-radius: 99px; padding: 3px 10px; }
.lc.q { min-height: 200px; justify-content: center; }
.lc.q .cat { position: absolute; top: 16px; left: 16px; }
.lc-word { font-size: clamp(24px, 7.5vw, 34px); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; word-break: break-word; hyphens: auto; -webkit-hyphens: auto; margin-top: 6px; align-self: stretch; }
.lc-ko { font-size: 22px; font-weight: 800; color: var(--eosin); margin: 4px 0 2px; }
.lc-ask { margin: 8px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }
.lc-hint { font-size: 14px; color: var(--muted); }
.lc .info { align-self: stretch; text-align: left; margin-top: 8px; }
.fb-word { font-weight: 800; }
.miss-n { flex: none; min-width: 26px; height: 22px; border-radius: 99px; background: var(--bad-soft); color: var(--bad); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.wk-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.wk-stats b { display: block; font-size: 22px; font-weight: 800; }
.wk-stats span { font-size: 12px; color: var(--muted); }
.month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-head h2 { margin: 0; }
.month-head .arrows { display: flex; gap: 6px; }
.month-head .arrows button { width: 36px; height: 36px; border-radius: 50%; background: var(--field); font-size: 20px; font-weight: 700; }
.cal-wk, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-wk { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.cal-d { aspect-ratio: 1; border-radius: 10px; background: var(--field); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.cal-d.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--field)); color: var(--ink); }
.cal-d.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--field)); color: var(--ink); }
.cal-d.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--field)); color: var(--accent-ink); }
.cal-d.l4 { background: var(--accent); color: var(--accent-ink); }
.cal-d.today { box-shadow: 0 0 0 2px var(--eosin); font-weight: 800; }
.cal-d.future { opacity: .4; }
.cal-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.cal-legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--field); }
.cal-legend i.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--field)); } .cal-legend i.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--field)); }
.cal-legend i.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--field)); } .cal-legend i.l4 { background: var(--accent); }
.sync-code { font: 700 19px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; word-spacing: .2em; background: var(--field); border-radius: 12px; padding: 10px 12px; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.lc-pic { width: 120px; height: 120px; border-radius: 18px; background: var(--field); padding: 6px; margin: 6px auto 2px; }
.feedback.has-pic { display: flex; gap: 12px; align-items: center; }
.fb-pic { flex: none; width: 64px; height: 64px; border-radius: 12px; background: var(--card); padding: 3px; }
.wl-pic, .pop-pic { display: block; width: 110px; height: 110px; border-radius: 16px; background: var(--field); padding: 6px; margin: 8px 0; }
.retry { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.retry s { opacity: .8; }
.def-ko { margin-top: 6px !important; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14.5px; }
.add-mini { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 20px; font-weight: 700; line-height: 1; }
.add-mini.done { background: var(--good-soft); color: var(--good); font-size: 15px; }
/* 퀴즈 */
.q-count { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.q-text { font-size: 20px; font-weight: 800; line-height: 1.35; margin: 0 0 16px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card); box-shadow: var(--shadow); font-size: 16.5px; border: 2px solid transparent; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.feedback { overflow-wrap: anywhere; margin-top: 14px; padding: 12px 14px; border-radius: var(--r-sm); font-size: 15.5px; }
.feedback.ok { background: var(--good-soft); } .feedback.no { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 15px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <p class="date" id="today-date"></p>
    <h1 id="page-title">단어장</h1>
  </header>
  <section id="tab-words"></section>
  <section id="tab-learn" hidden></section>
</main>

<nav class="tabbar">
  <button data-tab="words" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3.5" width="13" height="16" rx="2.5"/><path d="M4 7.5v11a2.5 2.5 0 0 0 2.5 2.5H15"/><path d="M10 9h5M10 12.5h5"/></svg>
    단어장
  </button>
  <button data-tab="learn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5l4 2-3.5 7-4-2z"/><path d="M11.2 8.2l1.6.8"/><path d="M14.5 10.5a5 5 0 0 1-2 9"/><path d="M5 20.5h14"/><path d="M8 20.5v-2h7"/></svg>
    병리 공부
  </button>
</nav>

<div id="overlay" class="overlay" hidden><div class="overlay-inner" id="overlay-inner"></div></div>
<div id="sheet-bg" class="sheet-bg" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="words.js"></script>
<script src="words-auto.js"></script>
<script src="words-ko.js"></script>
<script src="lessons.js"></script>
<script src="lessons2.js"></script>
<script src="lessons-auto.js"></script>
<script src="bodymap.js"></script>
<script src="fachsprache.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  say: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
};

// ── 저장 (이 휴대폰 안에만) ──
const KEY = 'patho-deutsch-v1';
const INTERVAL = [0, 1, 3, 7, 14, 30, 60]; // 상자 번호별 다음 복습까지 날짜 수
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
const DEFAULTS = () => ({ prog: {}, day: null, streak: { last: -9, n: 0 }, set: { per: 10 }, mine: [], lessons: {}, tab: 'words', log: {}, miss: {} });
S = Object.assign(DEFAULTS(), S);
delete S.set.front;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} markDirty(); };

// ── 백업·동기화: 기록 전체를 서버(patho-deutsch-sync)에 코드별로 보관 ──
// 바뀔 때마다 2.5초 뒤 올리고, 앱을 열거나 다시 볼 때 서버가 더 새로우면 내려받음(마지막에 바꾼 기기 기준).
const SYNC_URL = 'https://patho-deutsch-sync.weekly-meals-reader.workers.dev/s/';
const SKEY = 'patho-deutsch-sync';
let SY;
try { SY = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { SY = {}; }
if (!SY.key) {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(32));
  SY = { key: [...r].map(x => c[x % c.length]).join(''), t: 0 };
}
const saveSY = () => { try { localStorage.setItem(SKEY, JSON.stringify(SY)); } catch {} };
saveSY();
let syncReady = false, dirtyEarly = false, pushTimer = null;
function markDirty() {
  if (!syncReady) { dirtyEarly = true; return; } // 처음 내려받기 전에는 표시만
  SY.t = Date.now(); saveSY();
  clearTimeout(pushTimer); pushTimer = setTimeout(pushSync, 2500);
}
async function pushSync() {
  try {
    const r = await fetch(SYNC_URL + SY.key, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: SY.t, data: S }) });
    const j = await r.json();
    if (j.ok) { SY.last = Date.now(); SY.err = ''; } else if (j.newer) await pullSync();
  } catch { SY.err = '인터넷 연결 없음'; }
  saveSY();
}
async function pullSync() {
  try {
    const r = await fetch(SYNC_URL + SY.key, { cache: 'no-store' }), j = await r.json();
    if (j.data && j.t > SY.t) applyRemote(j);
    else { if (!j.data || j.t < SY.t) pushSync(); SY.last = Date.now(); SY.err = ''; saveSY(); }
  } catch { SY.err = '인터넷 연결 없음'; saveSY(); }
}
function applyRemote(j) {
  if (!$('#overlay').hidden) { SY.pending = j; return; } // 공부 중이면 화면을 닫은 뒤에
  S = Object.assign(DEFAULTS(), j.data);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
  SY.t = j.t; SY.last = Date.now(); SY.err = ''; delete SY.pending; saveSY();
  DICT = null;
  S.tab === 'learn' ? renderLearn() : renderWords();
  toast('다른 기기의 공부 기록을 불러왔어요');
}
async function startSync() {
  await pullSync();
  syncReady = true;
  if (dirtyEarly) markDirty();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncReady) pullSync(); });
function syncStatus() {
  if (SY.err) return SY.err;
  if (!SY.last) return '아직 저장 전';
  const min = Math.round((Date.now() - SY.last) / 6e4);
  return min < 1 ? '방금 저장됨' : min < 60 ? `${min}분 전 저장` : `${Math.round(min / 60)}시간 전 저장`;
}
function openSync() {
  const code = SY.key.match(/.{1,4}/g).join(' ');
  openSheet(`<div class="sheet-head"><h2>백업·동기화</h2><button class="x-btn" id="sh-close" aria-label="닫기">${ICON.x}</button></div>
    <div class="sheet-body">
      <p class="sub" style="margin:0">공부 기록이 자동으로 서버에 저장돼요. 휴대폰을 바꾸거나 다른 기기(아이패드 등)에서 이어 하려면, 그 기기에서 아래 코드를 입력하세요.</p>
      <div class="card" style="margin:12px 0">
        <h2 style="margin-bottom:6px">이 기기의 동기화 코드</h2>
        <div class="sync-code">${esc(code)}</div>
        <div class="row" style="margin-top:10px"><button class="btn ghost small" id="sy-copy">코드 복사</button><button class="btn ghost small" id="sy-now">지금 저장</button></div>
        <p class="sub" style="margin:8px 0 0">상태: ${esc(syncStatus())}</p>
      </div>
      <label class="f" for="sy-in">다른 기기의 코드로 연결</label>
      <div class="row"><input class="inp" id="sy-in" placeholder="코드 32자리 (띄어쓰기 상관없음)" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" id="sy-link" style="flex:none">연결</button></div>
      <p class="sub" style="margin:6px 0 0">연결하면 이 기기의 기록은 그 코드에 저장된 기록으로 바뀌어요.</p>
      <label class="f">백업 파일</label>
      <div class="row"><button class="btn ghost" id="sy-export">파일로 저장</button><label class="btn ghost" style="cursor:pointer">파일 불러오기<input type="file" id="sy-import" accept="application/json,.json" hidden></label></div>
      <p class="sub" style="margin:10px 0 0">코드를 아는 사람은 기록을 볼 수 있으니 다른 사람에게 알려 주지 마세요.</p>
    </div>`);
  $('#sh-close').onclick = closeSheet;
  $('#sy-copy').onclick = async () => { try { await navigator.clipboard.writeText(SY.key); toast('코드를 복사했어요'); } catch { toast('복사가 안 돼요. 길게 눌러 복사하세요'); } };
  $('#sy-now').onclick = async () => { SY.t = Math.max(SY.t, 1); await pushSync(); openSync(); toast(SY.err || '저장했어요'); };
  $('#sy-link').onclick = async () => {
    const k = $('#sy-in').value.replace(/\s+/g, '');
    if (!/^[A-Za-z0-9]{24,64}$/.test(k)) return toast('코드가 올바르지 않아요');
    if (k === SY.key) return toast('이 기기의 코드예요');
    try {
      const j = await (await fetch(SYNC_URL + k, { cache: 'no-store' })).json();
      if (!j.data) return toast('그 코드로 저장된 기록이 없어요');
      if (!confirm('이 기기의 공부 기록을 그 코드의 기록으로 바꿀까요?')) return;
      SY = { key: k, t: 0 }; saveSY();
      closeSheet(); applyRemote(j);
    } catch { toast('인터넷 연결을 확인해 주세요'); }
  };
  $('#sy-export').onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'patho-deutsch', t: Date.now(), data: S })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `patho-deutsch-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#sy-import').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.app !== 'patho-deutsch' || !j.data) throw 0;
      if (!confirm('이 기기의 공부 기록을 백업 파일의 기록으로 바꿀까요?')) return;
      S = Object.assign(DEFAULTS(), j.data); DICT = null; save(); closeSheet(); renderWords(); toast('백업 파일을 불러왔어요');
    } catch { toast('백업 파일을 읽을 수 없어요'); }
  };
}
try { navigator.storage?.persist?.(); } catch {}

const today = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const allWords = () => S.mine.concat(WORDS);
const byId = id => allWords().find(w => w.id === id);

function pickNew(k, exclude = []) {
  const out = [];
  for (const w of [...S.mine, ...WORDS.filter(x => x.auto), ...WORDS.filter(x => !x.auto)]) {
    if (out.length >= k) break;
    if (!S.prog[w.id] && !exclude.includes(w.id)) out.push(w.id);
  }
  return out;
}
function ensureDay() {
  const t = today();
  if (!S.day || S.day.n !== t) { S.day = { n: t, ids: pickNew(S.set.per), done: [] }; save(); }
  S.day.ids = S.day.ids.filter(byId);
}
const dueIds = () => { const t = today(); return Object.keys(S.prog).filter(id => S.prog[id].d <= t && !S.day.ids.includes(id) && byId(id)); };
const learnedCount = () => Object.keys(S.prog).filter(byId).length;
const streakNow = () => (S.streak.last >= today() - 1 ? S.streak.n : 0);

// ── 독일어 읽어 주기 ──
// 목소리: 고르지 않으면 휴대폰 기본 독일어 목소리(아이폰 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 독일어).
// 앱에서 고르면 그 목소리(voiceURI)를 저장해서 씀.
const FUN_VOICES = /^(eddy|flo|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|bad news|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph)/i;
const germanVoices = () => ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(v => /^de(-|_|$)/i.test(v.lang));
function chosenVoice() { return S.set.voice ? germanVoices().find(v => v.voiceURI === S.set.voice) || null : null; }
if ('speechSynthesis' in window) speechSynthesis.getVoices();
function speak(text, voice) {
  if (!('speechSynthesis' in window)) return toast('이 기기에서는 읽어 주기가 안 돼요');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  const v = voice || chosenVoice(); if (v) u.voice = v;
  u.rate = S.set.rate || .92;
  speechSynthesis.speak(u);
}
const SAMPLE = 'Die Probe ist ohne Beschriftung angekommen. Bitte drei Stufen schneiden.';
function openVoice() {
  const draw = () => {
    const vs = germanVoices().sort((a, b) => (FUN_VOICES.test(a.name) - FUN_VOICES.test(b.name)) || (/de-DE/i.test(b.lang) - /de-DE/i.test(a.lang)) || a.name.localeCompare(b.name));
    const row = (uri, name, sub) => `<li><div class="wl-row" style="gap:12px">
        <button class="v-pick ${(S.set.voice || '') === uri ? 'on' : ''}" data-v="${esc(uri)}" aria-label="고르기"></button>
        <span class="w">${esc(name)}${sub ? `<small class="sub" style="display:block;font-weight:500">${esc(sub)}</small>` : ''}</span>
        <button class="say sm" data-try="${esc(uri)}" aria-label="들어보기">${ICON.say}</button></div></li>`;
    openSheet(`<div class="sheet-head"><h2>발음 목소리</h2><button class="x-btn" id="sh-close" aria-label="닫기">${ICON.x}</button></div>
      <div class="sheet-body">
        <label class="f" style="margin-top:0">속도</label>
        <div class="seg" id="v-rate">${[[.75, '느리게'], [.92, '보통'], [1.05, '빠르게']].map(([r, t]) => `<button class="chip ${(S.set.rate || .92) === r ? 'on' : ''}" data-r="${r}">${t}</button>`).join('')}</div>
        <label class="f">목소리 (🔊로 들어보고 고르세요)</label>
        <ul class="wl" id="v-list">
          ${row('', '휴대폰 기본 목소리', '아이폰 설정에서 고른 독일어 목소리')}
          ${vs.map(v => row(v.voiceURI, v.name, (FUN_VOICES.test(v.name) ? '재미용 목소리 · ' : '') + v.lang)).join('')}
        </ul>
        ${vs.length ? '' : '<p class="sub">독일어 목소리 목록을 아직 못 불러왔어요. 창을 닫고 다시 열어 보세요.</p>'}
        <p class="sub" style="margin-top:12px">더 자연스러운 목소리는 아이폰 <b>설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 독일어</b>에서 '고품질'(또는 Premium) 목소리를 내려받은 뒤, 앱을 껐다 켜면 이 목록에 나와요.</p>
      </div>`);
    $('#sh-close').onclick = closeSheet;
    $('#v-rate').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; S.set.rate = +b.dataset.r; save(); draw(); speak(SAMPLE); };
    $('#v-list').onclick = e => {
      const t = e.target.closest('[data-try]');
      if (t) return speak(SAMPLE, t.dataset.try ? germanVoices().find(v => v.voiceURI === t.dataset.try) : null);
      const p = e.target.closest('[data-v]');
      if (p) { S.set.voice = p.dataset.v || ''; save(); draw(); speak(SAMPLE); }
    };
  };
  draw();
}

// ── 단어 표시 도우미 ──
const isVerb = w => !w.art && /,/.test(w.pl || '');
function plural(w) {
  if (!w.art) return w.pl || '';
  if (!w.pl) return '';
  if (w.pl === '-') return 'die ' + w.de;
  if (w.pl.startsWith('-')) return 'die ' + w.de + w.pl.slice(1);
  return 'die ' + w.pl;
}
const artHtml = w => (w.art ? `<span class="art ${esc(w.art)}">${esc(w.art)}</span> ` : '');
const wordHtml = w => artHtml(w) + esc(w.de);
const defKo = w => (typeof DEF_KO !== 'undefined' && DEF_KO[w.id]) || '';
const sayText = w => (w.art ? w.art + ' ' : '') + w.de;
const kindTag = w => (isVerb(w) ? ' <span class="kind">Verb</span>' : '');
function markEx(w) {
  const t = esc(w.ex || '');
  const stem = w.de.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return t.replace(new RegExp('(' + stem + '\\p{L}*)', 'iu'), '<mark>$1</mark>'); } catch { return t; }
}

// ── 탭 ──
function setTab(tab) {
  S.tab = tab; save();
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

// ═════════ 학습 기록 (달력·통계) ═════════
// S.log[날짜번호] = { n: 새로 끝낸 단어, r: 복습 문제, p: 연습 문제, ok: 맞힌 수, all: 푼 수 }
function logStudy(kind, ok) {
  const t = today();
  S.log = S.log || {};
  const e = S.log[t] = S.log[t] || { n: 0, r: 0, p: 0, ok: 0, all: 0 };
  e[kind]++; e.all++; if (ok) e.ok++;
  // 연속 일수: 무엇이든 공부한 날이면 이어짐
  if (S.streak.last !== t) {
    S.streak.n = S.streak.last === t - 1 ? S.streak.n + 1 : 1;
    S.streak.last = t;
    S.streak.best = Math.max(S.streak.best || 0, S.streak.n);
  }
}
let CAL = 0; // 0 = 이번 달, -1 = 지난달 …
function openCalendar() { CAL = 0; openOverlay(); renderCalendar(); }
function renderCalendar() {
  const now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + CAL, 1);
  const y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate();
  const dn = d => Math.floor(Date.UTC(y, m, d) / 864e5), t = today();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // 월요일 시작
  const log = S.log || {};
  const lvl = e => (!e ? 0 : e.all >= 40 ? 4 : e.all >= 20 ? 3 : e.all >= 8 ? 2 : 1);
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const k = dn(d), e = log[k];
    cells += `<button class="cal-d l${lvl(e)} ${k === t ? 'today' : ''} ${k > t ? 'future' : ''}" data-k="${k}"><span>${d}</span></button>`;
  }
  // 최근 7일 합계
  const week = { n: 0, r: 0, p: 0, ok: 0, all: 0, days: 0 };
  for (let k = t - 6; k <= t; k++) { const e = log[k]; if (!e) continue; week.days++; for (const f of ['n', 'r', 'p', 'ok', 'all']) week[f] += e[f]; }
  const monthSum = Object.entries(log).filter(([k]) => k >= dn(1) && k <= dn(days)).reduce((a, [, e]) => (a.days++, a.all += e.all, a), { days: 0, all: 0 });
  const learned = learnedCount(), strong = Object.values(S.prog).filter(p => p.b >= 4).length;
  $('#overlay-inner').innerHTML = `
    <div class="topbar"><button class="x-btn" id="close" aria-label="닫기">${ICON.x}</button><h2 style="flex:1;margin:0;font-size:20px;font-weight:800">학습 기록</h2></div>
    <div class="tiles">

      <div class="tile"><b class="num">${S.streak.best || streakNow()}</b><span>🏆 최고 기록</span></div>
      <div class="tile"><b class="num">${learned}</b><span>📚 배운 단어</span></div>
    </div>
    <div class="card">
      <h2>최근 7일</h2>

        <div><b class="num">${week.days}</b><span>공부한 날</span></div>
        <div><b class="num">${week.n}</b><span>새 단어</span></div>
        <div><b class="num">${week.r}</b><span>복습</span></div>

        <button id="cal-prev" aria-label="이전 달">‹</button><button id="cal-next" aria-label="다음 달" ${CAL >= 0 ? 'disabled style="opacity:.35"' : ''}>›</button></div></div>
      <div class="cal-wk">${['월', '화', '수', '목', '금', '토', '일'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span>적게</span><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>많이</span></div>
      <p class="sub" id="cal-info" style="margin:10px 0 0">이번 달 ${monthSum.days}일 공부 · 문제 ${monthSum.all}개. 날짜를 누르면 그날 기록이 나와요.</p>
    </div>`;
  $('#close').onclick = closeStudy;

  $('#overlay-inner').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, e = log[k], d = new Date(k * 864e5);
    const label = `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일`;
    $('#cal-info').innerHTML = e ? `<b>${label}</b> · 새 단어 ${e.n} · 복습 ${e.r} · 연습 ${e.p} · 정답률 ${Math.round((e.ok / e.all) * 100)}%` : `<b>${label}</b> · 기록 없음`;
  });
}

// ═════════ 연습: 관사 퀴즈 · 빈칸 채우기 ═════════
let PR = null;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isNoun = w => ['der', 'die', 'das'].includes(w.art) && !w.de.includes(' ');
const norm = s => s.trim().toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
// 배운 단어가 충분하면 배운 단어에서, 아니면 전체 단어에서. 전에 틀린 단어를 먼저(최대 절반)
function practicePool(ok, n, missKey) {
  const all = allWords().filter(ok);
  const learned = all.filter(w => S.prog[w.id]);
  const base = learned.length >= n ? learned : all;
  const miss = S[missKey] || {};
  const missed = shuffle(base.filter(w => miss[w.id] > 0)).slice(0, Math.ceil(n / 2));
  const rest = shuffle(base.filter(w => !missed.includes(w)));
  return { words: missed.concat(rest).slice(0, n), fromLearned: base === learned };
}
function bumpMiss(key, id, d) { const m = S[key] = S[key] || {}; m[id] = Math.max(0, (m[id] || 0) + d); if (!m[id]) delete m[id]; }
function openOverlay() { $('#overlay').hidden = false; document.body.style.overflow = 'hidden'; }
function closePractice() { PR = null; closeStudy(); }
function practiceTop() {
  const n = PR.words.length;
  return `<div class="topbar"><button class="x-btn" id="close" aria-label="닫기">${ICON.x}</button>
    <div class="bar"><i style="width:${(PR.i / n) * 100}%"></i></div><span class="count num">${PR.i} / ${n}</span></div>`;
}
function wireCommon(inner) {

  inner.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
}

// 빈칸 채우기: 예문에서 그 단어(어미 3글자까지)를 찾아 빈칸으로
function clozeOf(w) {
  if (!w.ex || w.de.includes(' ')) return null;
  const stem = w.de.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const m = new RegExp('(?<![\\p{L}])' + stem + '\\p{L}{0,3}(?![\\p{L}])', 'iu').exec(w.ex);
  return m ? { before: w.ex.slice(0, m.index), word: m[0], after: w.ex.slice(m.index + m[0].length) } : null;
}

  const kind = x => (x.art ? 'n' : isVerb(x) ? 'v' : 'a');

}
function startCloze(mode) {

  PR = { kind: 'cloze', mode, words, i: 0, score: 0, picked: null, wrong: [], fromLearned, hint: false, typed: '' };
  openOverlay(); renderCloze();
}
function renderCloze() {
  const inner = $('#overlay-inner');
  if (PR.i >= PR.words.length) return renderPracticeDone();
  const w = PR.words[PR.i], c = clozeOf(w), ans = PR.picked != null, ok = PR.picked === true;
  if (!PR.opts || PR.opts.i !== PR.i) PR.opts = { i: PR.i, list: shuffle([w, ...distractors(w, 3)]) };
  const gapTxt = PR.mode === 'type' && PR.hint ? esc(c.word[0]) + '…' : '&nbsp;';
  const sent = ans ? `${esc(c.before)}<mark class="${ok ? 'ok' : 'no'}">${esc(c.word)}</mark>${esc(c.after)}`
                   : `${esc(c.before)}<span class="gap">${gapTxt}</span>${esc(c.after)}`;
  inner.innerHTML = practiceTop() + `
    <div class="seg" style="justify-content:center;margin-bottom:12px">
      <button class="chip ${PR.mode === 'choice' ? 'on' : ''}" data-m="choice">보기 고르기</button>
      <button class="chip ${PR.mode === 'type' ? 'on' : ''}" data-m="type">직접 쓰기</button></div>
    <div class="card cz">
      <p class="cz-sent">${sent}</p>
      <div class="cz-foot">
        ${ans || PR.hint ? `<p class="cz-ko">💡 ${esc(w.ko)}${ans ? ` · ${wordHtml(w)}` : ''}</p>` : '<button class="chip" id="hint">💡 힌트 (뜻 보기)</button><span style="flex:1"></span>'}
        ${ans ? `<button class="say sm" data-say="${esc(w.ex)}" aria-label="예문 듣기">${ICON.say}</button>` : ''}

    </div>
    ${PR.mode === 'choice'
      ? `<div class="opts">${PR.opts.list.map(o => { const cls = !ans ? '' : o === w ? 'right' : o.id === PR.pickedId ? 'wrong' : '';
          return `<button class="opt ${cls}" data-o="${esc(o.id)}" ${ans ? 'disabled' : ''}>${esc(o.de)}</button>`; }).join('')}</div>`
      : `<form id="tf" class="row" autocomplete="off"><input class="inp" id="ti" placeholder="빈칸에 들어갈 단어" autocapitalize="off" autocorrect="off" spellcheck="false" ${ans ? 'disabled' : ''} value="${esc(PR.typed)}"><button class="btn" style="flex:none" ${ans ? 'disabled' : ''}>확인</button></form>`}
    ${ans ? `<div class="feedback ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Richtig!' : '✗ Leider falsch'}</b>정답: ${esc(c.word)}${norm(c.word) !== norm(w.de) ? ` (기본형 ${esc(w.de)})` : ''}</div>
      <button class="btn wide" id="next" style="margin-top:12px">${PR.i + 1 < PR.words.length ? '다음' : '결과 보기'}</button>` : ''}`;
  wireCommon(inner);
  inner.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { PR.mode = b.dataset.m; S.set.cloze = PR.mode; save(); renderCloze(); });
  $('#hint')?.addEventListener('click', () => { PR.hint = true; renderCloze(); });
  const answer = good => {
    PR.picked = good;
    if (good) { PR.score++; bumpMiss('clozeMiss', w.id, -1); } else { PR.wrong.push(w); bumpMiss('clozeMiss', w.id, 1); bumpMiss('miss', w.id, 1); }
    logStudy('p', good);
    save(); renderCloze();
  };
  inner.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { PR.pickedId = b.dataset.o; answer(b.dataset.o === w.id); });
  $('#tf')?.addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#ti').value; if (!v.trim()) return;
    PR.typed = v; answer(norm(v) === norm(c.word) || norm(v) === norm(w.de));
  });
  $('#next')?.addEventListener('click', () => { PR.i++; PR.picked = null; PR.pickedId = null; PR.typed = ''; PR.hint = false; renderCloze(); });
  if (PR.mode === 'type' && !ans) setTimeout(() => $('#ti')?.focus(), 60);
}
function renderPracticeDone() {

// 단어 → 그림 key (Fachsprache 모음의 일상어·의학 용어로 찾고, 몇 개는 직접 지정)

  ['💬 직장 독일어', ['kommunikation'], 'de'],
];
{

// 새로 추가된 장: added 날짜가 14일 안이고 아직 안 읽은 장
const isNewLesson = l => !!l.added && !S.lessons[l.id]?.read && (Date.now() - new Date(l.added + 'T00:00:00').getTime()) < 14 * 864e5;
const REPO = 'https://github.com/trykyn/patho-deutsch';
// 사전: 단어장 + 각 장의 핵심 용어. 어미를 조금 떼어 보며 찾음 (Proben → Probe)
let DICT = null;
function dict() {
  if (DICT && DICT.n === S.mine.length) return DICT.m;
  const m = new Map();
  const add = (de, e) => { const k = de.toLowerCase(); if (k.length >= 2 && !m.has(k)) m.set(k, e); };
  for (const w of allWords()) if (!w.de.includes(' ')) add(w.de, { w });
  // 불규칙 복수형도 (Bronchien → Bronchus, Schwämme → Schwamm)
  for (const w of allWords()) if (w.art && w.pl && !w.pl.startsWith('-') && !w.pl.includes(' ')) add(w.pl, { w });
  for (const l of LESSONS) for (const [t, ko] of l.terms) for (const part of t.split(' / ')) {
    const sp = splitTerm(part.trim()); if (!sp.de.includes(' ')) add(sp.de, { term: { art: sp.art, de: sp.de, ko } });
  }
  // Fachsprache 모음의 의학 용어도 (Kolon → 대장 = der Dickdarm)
  for (const g of FACH) for (const [al, fa, , , ko] of g.rows) for (const part of fa.split(' / ')) {
    const name = part.replace(/\s*\(.*\)/, '').trim();
    if (/^[\p{L}-]+$/u.test(name) && !name.startsWith('-')) add(name, { exact: name.length <= 5, term: { art: '', de: name, ko: ko + ' (= ' + al + ')' } });
  }
  DICT = { n: S.mine.length, m };
  return m;
}
const SUFFIX = ['', 'n', 'en', 'e', 's', 'es', 'er', 'ern', 'em', 'nen', 'ien'];
function lookupWord(tok) {
  const m = dict(), t = tok.toLowerCase().replace(/-$/, '');
  for (const s of SUFFIX) {
    if (s && !t.endsWith(s)) continue;
    const base = s ? t.slice(0, -s.length) : t;
    const e = m.get(base);
    if (base.length >= 3 && e && !(s && e.exact)) return e;
  }
  return null;
}
const tapWrap = s => s.split(/([\p{L}][\p{L}\p{N}-]*)/u).map((p, i) => (i % 2 ? `<span class="tw${lookupWord(p) ? ' k' : ''}">${esc(p)}</span>` : esc(p))).join('');
function md(text, tap = false) {
  const inline = s => (tap ? tapWrap(s) : esc(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return text.trim().split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    let html = '', list = [];
    const flush = () => { if (list.length) { html += '<ul>' + list.map(l => `<li>${inline(l)}</li>`).join('') + '</ul>'; list = []; } };
    for (const l of lines) {
      if (l.startsWith('• ')) list.push(l.slice(2));
      else { flush(); html += `<p>${inline(l)}</p>`; }
    }
    flush();
    return html;
  }).join('');
}

      ${naver(clean)}
      <label class="f">뜻을 적어서 단어장에 넣기</label>
      <div class="seg" id="a-art">${['', 'der', 'die', 'das'].map(a => `<button class="chip ${a ? '' : 'on'}" data-a="${a}">${a || '관사 없음'}</button>`).join('')}</div>
      <label class="f" for="pop-de">독일어 (기본형으로 고쳐도 돼요)</label><input class="inp" id="pop-de" value="${esc(clean)}" autocapitalize="off" autocomplete="off">
      <label class="f" for="pop-ko">한국어 뜻</label><input class="inp" id="pop-ko" autocomplete="off">
      <button class="btn wide" id="pop-add" style="margin-top:14px">단어장에 넣기</button>
    </div>`);
    let art = '';
    $('#a-art').onclick = ev => { const b = ev.target.closest('[data-a]'); if (!b) return; art = b.dataset.a; document.querySelectorAll('#a-art .chip').forEach(c => c.classList.toggle('on', c === b)); };
    $('#pop-add').onclick = () => {
      const de = $('#pop-de').value, ko = $('#pop-ko').value;
      if (!de.trim() || !ko.trim()) return toast('독일어와 한국어 뜻을 적어 주세요');
      if (addMine({ art, de, ko })) { toast('단어장에 넣었어요'); closeSheet(); }
    };
  }
  $('#sh-close').onclick = closeSheet;
  $('#sheet').querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
}
// "내용이 이상해요": GitHub 이슈(라벨 content)로 보냄 → 매주 자동 작업이 읽고 고침
function openReport(l) {
  openSheet(`<div class="sheet-head"><h2>내용이 이상해요</h2><button class="x-btn" id="sh-close" aria-label="닫기">${ICON.x}</button></div>
    <div class="sheet-body">
      <p class="sub" style="margin:0">${l.icon} ${esc(l.de)}</p>
      <label class="f">어디가 이상한가요?</label>
      <div class="seg" id="r-where">${['본문', '번역', '용어', '퀴즈', '기타'].map((x, i) => `<button class="chip ${i ? '' : 'on'}" data-w="${x}">${x}</button>`).join('')}</div>
      <label class="f" for="r-text">무엇이 틀렸는지 적어 주세요 (우리 병원에서는 이렇게 해요 등)</label>
      <textarea class="inp" id="r-text" style="min-height:110px"></textarea>
      <button class="btn wide" id="r-send" style="margin-top:14px">GitHub로 보내기</button>
      <p class="sub" style="margin:10px 0 0">GitHub 페이지가 열리면 로그인된 상태에서 <b>Create</b>(또는 Submit)를 누르면 끝이에요. 매주 월요일 자동 작업이 읽고 고쳐요.</p>
    </div>`);
  let where = '본문';
  $('#sh-close').onclick = closeSheet;
  $('#r-where').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; where = b.dataset.w; document.querySelectorAll('#r-where .chip').forEach(c => c.classList.toggle('on', c === b)); };
  $('#r-send').onclick = () => {
    const text = $('#r-text').value.trim();
    if (!text) return toast('무엇이 이상한지 적어 주세요');
    const title = `[내용] ${l.de} (${l.id}) – ${where}`;
    const body = `장: ${l.de} / ${l.ko}\nid: ${l.id}\n부분: ${where}\n\n${text}`;
    window.open(`${REPO}/issues/new?labels=content&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, '_blank', 'noopener');
    closeSheet();
  };
}
function splitTerm(t) {
  const m = t.match(/^(der|die|das)\s+(.+)$/);
  return m ? { art: m[1], de: m[2] } : { art: '', de: t };
}
function renderQuiz(box) {
  const l = LESSONS.find(x => x.id === LV.id);
  if (LV.i >= l.quiz.length) {
    const prev = S.lessons[l.id] || {};
    const best = Math.max(prev.score ?? 0, LV.score);
    S.lessons[l.id] = Object.assign({}, prev, { score: best, total: l.quiz.length }); save();
    const perfect = LV.score === l.quiz.length;
    box.innerHTML = `
      <button class="back-link" id="lb">${ICON.back} 목록</button>
      <div class="card" style="text-align:center;padding:28px 16px">
        <div style="font-size:56px;line-height:1">${perfect ? '🏆' : LV.score >= l.quiz.length / 2 ? '👏' : '📚'}</div>
        <h2 style="font-size:24px;margin:12px 0 4px">${LV.score} / ${l.quiz.length}</h2>
        <p class="sub" style="margin:0 0 18px">${perfect ? 'Perfekt! 다 맞혔어요.' : LV.score >= l.quiz.length / 2 ? 'Gut gemacht! 틀린 부분은 본문을 다시 봐요.' : '본문을 한 번 더 읽고 다시 풀어 봐요.'}</p>
        <div class="row"><button class="btn ghost" id="qa">다시 풀기</button><button class="btn" id="qr">본문 보기</button></div>
      </div>`;
    $('#lb').onclick = () => { LV = { type: 'list' }; renderLearn(); };
    $('#qa').onclick = () => { LV = { type: 'quiz', id: l.id, i: 0, score: 0, picked: null }; renderLearn(); };
    $('#qr').onclick = () => { LV = { type: 'lesson', id: l.id }; renderLearn(); window.scrollTo(0, 0); };
    return;
  }
  const q = l.quiz[LV.i], answered = LV.picked != null;
  // 보기 순서는 문제마다 섞음 (정답 위치를 외우지 않게)
  if (!LV.perm || LV.perm.i !== LV.i) LV.perm = { i: LV.i, o: q.a.map((_, k) => k).sort(() => Math.random() - .5) };
  box.innerHTML = `
    <button class="back-link" id="lb">${ICON.back} ${esc(l.de)}</button>
    <div class="q-count num">${l.icon} 문제 ${LV.i + 1} / ${l.quiz.length}</div>
    <div class="bar" style="margin-bottom:16px"><i style="width:${(LV.i / l.quiz.length) * 100}%"></i></div>
    <p class="q-text">${esc(q.q)}</p>
    <div class="opts">${LV.perm.o.map(i => { const a = q.a[i];
      const cls = !answered ? '' : i === q.c ? 'right' : i === LV.picked ? 'wrong' : '';
      return `<button class="opt ${cls}" data-o="${i}" ${answered ? 'disabled' : ''}>${esc(a)}</button>`; }).join('')}</div>
    ${answered ? `<div class="feedback ${LV.picked === q.c ? 'ok' : 'no'}"><b>${LV.picked === q.c ? '✓ Richtig!' : '✗ Leider falsch'}</b>${esc(q.ex)}</div>
      <button class="btn wide" id="qn" style="margin-top:14px">${LV.i + 1 < l.quiz.length ? '다음 문제' : '결과 보기'}</button>` : ''}`;
  $('#lb').onclick = () => { LV = { type: 'lesson', id: l.id }; renderLearn(); window.scrollTo(0, 0); };
  box.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    LV.picked = +b.dataset.o; if (LV.picked === q.c) LV.score++;
    logStudy('p', LV.picked === q.c); save();
    renderLearn();
  });
  $('#qn')?.addEventListener('click', () => { LV.i++; LV.picked = null; renderLearn(); window.scrollTo(0, 0); });
}

// ── 기타 ──
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2000); }

$('#today-date').textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
// 자정이 지나서 다시 열면 새 날 단어로
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !ST && S.day && S.day.n !== today()) {
    $('#today-date').textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    if (S.tab === 'words') renderWords();
  }
});
document.body.insertAdjacentHTML('beforeend', BM.defs);
setTab(S.tab === 'learn' ? 'learn' : 'words');
startSync();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
</body>
